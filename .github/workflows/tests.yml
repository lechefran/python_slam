name: SLAM regression
on: [push, pull_request]
permissions:
  contents: read
jobs:
  headless:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install '.[test]'
      - run: python -m pip check
      - run: python -m pytest -q
      - name: Bound a synthetic native SLAM run
        run: |
          python scripts/generate_demo.py output/demo.avi --frames 30
          python slam.py output/demo.avi --focal 400 --headless --max-frames 30 --report output/report.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: report-${{ matrix.os }}-${{ matrix.python }}
          path: output/report.json
